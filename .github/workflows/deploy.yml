name: Deploy Pulse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and write Supabase config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'uploads' --exclude 'screenshots' \
            --exclude 'Sample Data Loader.dc.html' --exclude '*.sql'
          printf 'window.SUPABASE = { url: "%s", anonKey: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_KEY" > _site/supabase-config.js
          if [ -n "$ADMIN_PASSCODE" ]; then HASH=$(printf '%s' "$ADMIN_PASSCODE" | sha256sum | cut -d' ' -f1); else HASH=""; fi
          printf 'window.PULSE_ADMIN = { passcodeHash: "%s" };\n' "$HASH" > _site/admin-config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
